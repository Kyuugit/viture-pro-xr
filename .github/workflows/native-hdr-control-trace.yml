name: Native HDR static display control trace
on:
  push:
    paths:
      - '.github/workflows/native-hdr-control-trace.yml'
  workflow_dispatch:
permissions: {}
jobs:
  static-control-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install pinned disassembler in disposable runner
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: capstone==5.0.6
      - name: Decode data-loader logic, not execute it
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,struct,urllib.request
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_MCLASS
          with urllib.request.urlopen('https://static.viture.com/dfu-util/bin/n6p_latest.bin',timeout=35) as r:data=r.read(2000001)
          assert hashlib.sha256(data).hexdigest()=='5f3965f20e2e468efb70c6e268f2b7b2743bce47e6ecfa999faadf2637c96228'
          bias=0x0800efe8
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_MCLASS)
          for off in (0x24bd4,0x24be4):print('SCATTER_RECORD',hex(off),*[hex(x) for x in struct.unpack_from('<4I',data,off)])
          print('DECOMPRESSOR_DECODE_BEGIN')
          va=0x08010780;off=va-bias
          for i in md.disasm(data[off:off+320],va,95):
              print(hex(i.address-bias),hex(i.address),i.mnemonic,i.op_str)
          print('DECOMPRESSOR_DECODE_END')
          print('No firmware execution, extraction publication, mutation or device access.')
          PY
