name: Native HDR static display control trace
on:
  push:
    paths:
      - '.github/workflows/native-hdr-control-trace.yml'
  workflow_dispatch:
permissions: {}
jobs:
  static-control-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Decode initialized profile data with reviewed Python parser
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          parser_url='https://raw.githubusercontent.com/Kyuugit/viture-pro-xr/26cc2d55f2ddde41200f1b1a094393ab3f2a9f8d/tools/inspect_pro_profiles.py'
          with urllib.request.urlopen(parser_url,timeout=30) as r:source=r.read(50000)
          expected='2f361b19962da9a720a50803236edb1d17901cd552d93db4d89ddc461132c3c7'
          if hashlib.sha256(source).hexdigest()!=expected:raise SystemExit('Parser source hash mismatch')
          namespace={'__name__':'source_inspector'}
          exec(compile(source,parser_url,'exec'),namespace)
          checks=namespace['self_test']()
          with urllib.request.urlopen('https://static.viture.com/dfu-util/bin/n6p_latest.bin',timeout=35) as r:data=r.read(2000001)
          report=namespace['inspect'](data)
          report['parser_sha256']=expected
          report['decoder_fixtures_passed']=checks
          print('PROFILE_REPORT_BEGIN')
          print(json.dumps(report,indent=2,sort_keys=True))
          print('PROFILE_REPORT_END')
          print('Only our data parser executed. No vendor firmware execution, device access, patch or binary publication.')
          PY
