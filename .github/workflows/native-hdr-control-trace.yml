name: Native HDR static display control trace
on:
  push:
    paths:
      - '.github/workflows/native-hdr-control-trace.yml'
  workflow_dispatch:
permissions: {}
jobs:
  static-control-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install pinned disassembler in disposable runner
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: capstone==5.0.6
      - name: Decode bounded display code without executing firmware
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, struct, urllib.request
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_MCLASS
          from capstone.arm import ARM_OP_MEM, ARM_OP_IMM, ARM_OP_REG, ARM_REG_PC
          with urllib.request.urlopen('https://static.viture.com/dfu-util/bin/n6p_latest.bin', timeout=35) as r:
              data=r.read(2000001)
          sha=hashlib.sha256(data).hexdigest()
          assert sha=='5f3965f20e2e468efb70c6e268f2b7b2743bce47e6ecfa999faadf2637c96228'
          bias=0x0800efe8
          print('TRACE_INPUT',sha,'BIAS',hex(bias),'inferred from vector/reset layout; inspect relative references as cross-check')
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_MCLASS)
          md.detail=True
          def annotated(ins):
              text=hex(ins.address-bias)+' '+hex(ins.address)+' '+ins.mnemonic+' '+ins.op_str
              for o in ins.operands:
                  if o.type==ARM_OP_MEM and o.mem.base==ARM_REG_PC:
                      p=((ins.address+4)&~3)+o.mem.disp-bias
                      if 0<=p<len(data)-3:
                          text+=' ; literal@'+hex(p)+'='+hex(struct.unpack_from('<I',data,p)[0])
              return text
          for name,lo,hi in [('reset',0x1c4,0x1ec),('panel_writers',0x6b20,0x6bfd),('panel_init',0x6c70,0x6f5c),('color_state',0x13500,0x1382c)]:
              print('REGION_BEGIN',name,hex(lo),hex(hi))
              for ins in md.disasm(data[lo:hi],lo+bias): print(annotated(ins))
              print('REGION_END')
          labels={k:data.find(k.encode()) for k in ('panel_init','color_scheme_state:%d','L_OLED Write Reg','R_OLED Write Reg')}
          refs=[]
          for off in range(24,0x15e00,2):
              ins=next(md.disasm(data[off:off+4],off+bias,1),None)
              if ins is None: continue
              target=None
              if ins.mnemonic=='adr' and len(ins.operands)>1 and ins.operands[1].type==ARM_OP_IMM:
                  target=((ins.address+4)&~3)+ins.operands[1].imm-bias
              elif ins.mnemonic in ('addw','add','subw') and len(ins.operands)>2 and ins.operands[1].type==ARM_OP_REG and ins.operands[1].reg==ARM_REG_PC and ins.operands[2].type==ARM_OP_IMM:
                  target=((ins.address+4)&~3)+(ins.operands[2].imm if ins.mnemonic!='subw' else -ins.operands[2].imm)-bias
              if target is not None:
                  for name,t in labels.items():
                      if t-4<=target<=t+2: refs.append({'label':name,'reference_file':hex(off),'target_file':hex(target),'instruction':ins.mnemonic+' '+ins.op_str})
          print('RELATIVE_LABEL_REFERENCES',json.dumps(refs))
          print('Static decoding only. No firmware run, patch, flash or hardware measurement.')
          PY
